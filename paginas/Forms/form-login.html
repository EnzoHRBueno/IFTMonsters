<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <title>Formulários</title>
    <link rel="stylesheet" href="estilo2.css">
</head>
<body>
    <div id="center">
    <h1>Formulário de login</h1>
    <div class="conteudo-formulario">

        <form>
           <label for="pUsername">Username: </label> 
           <input type="text" name="nome" id="pNome" placeholder="Digite seu Username" required> <br>

           <h3>Selecione seu qual seu jogo favorito</h3>
           <input type="radio" name="jogo" id="warzone"><label for="warzone"> Warzone</label><br>
           <input type="radio" name="jogo"  id="rocket League"><label for="rocket league"> Rocket League</label><br>
           <input type="radio" name="jogo" id="fortnite"><label for="Fortnite"> Fortnite</label><br>
           <input type="radio" name="jogo" id="brawl"><label for="brawl"> Brawl Stars</label><br>
           <input type="radio" name="jogo" id="valorant"><label for="valorant"> Valorant</label><br>
           <input type="radio" name="jogo" id="free fire"><label for="free fire"> Free Fire</label><br>
           

           <h3>Dados da plataforma</h3>
           <label for="endEmail"> Email: </label>
           <input type="email" id="endEmail">
           <lapel for="password">Defina a senha:</lapel>
             <input type="senha" id="password">

        </form>
        <div class="conteudo-disciplina">

            <h3>Escolha em qual plataforma você joga</h3>
            <input type="checkbox" id="mob"><label for="mob">Celular</label>
            <input type="checkbox" id="pc"><label for="Computador">Computador</label>
            <input type="checkbox" id="con"><label for="con">Console</label>

           </div>
    </div>
    </div>
</body>
